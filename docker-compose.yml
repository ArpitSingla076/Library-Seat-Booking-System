# One command to run everything:  docker compose up --build
# App: http://localhost:8080   (first time: docker compose exec server node src/utils/seed.js)
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    depends_on: [mongo]
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/library_booking
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRE: 1h
      CLIENT_URL: http://localhost:8080
      NODE_ENV: production
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      MAIL_FROM: ${MAIL_FROM:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}

  client:
    build: ./client
    restart: unless-stopped
    depends_on: [server]
    ports:
      - "8080:80"

volumes:
  mongo-data:
